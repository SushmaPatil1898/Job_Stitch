[theme]
# "Luminous purple and black" — a near-true-black background with a
# vivid, glowing violet accent (matches the title/tagline glow in app.py
# and the Job Stitch logo).
base = "dark"
primaryColor = "#C13CFF"
backgroundColor = "#070108"
secondaryBackgroundColor = "#1B0B24"
textColor = "#F6EEFB"
font = "sans serif"
